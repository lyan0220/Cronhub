name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Initialize database schema
        run: npx wrangler d1 execute cronjob_db --remote --file=src/schema.sql

      - name: Sync secrets
        run: |
          # pipefail：secret list 失败时中止，防止 EXISTING 误为空导致 TOKEN_ENC_KEY 被覆盖
          set -eo pipefail
          EXISTING=$(npx wrangler secret list | jq -r '.[].name')

          if ! echo "$EXISTING" | grep -qx 'TOKEN_ENC_KEY'; then
            openssl rand -hex 32 | npx wrangler secret put TOKEN_ENC_KEY
          fi

          if [ -n "$ADMIN_PASSWORD" ]; then
            printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          else
            echo "::warning::ADMIN_PASSWORD secret is not set"
          fi
